name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            push-server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The rest notifications server (Cloudflare Worker): check that it bundles, without deploying.
      - run: npm ci
        working-directory: push-server
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: push-server
        env:
          WRANGLER_SEND_METRICS: 'false'
