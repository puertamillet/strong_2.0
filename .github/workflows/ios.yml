name: iOS

# The iPhone app (Capacitor, ios/), built on GitHub's Macs, which are free for public repositories.
# Every push builds it for the simulator and runs it there (a screenshot, and the app's console,
# which must have no errors), and builds it for the iPhone without signing: SideStore signs it with
# your Apple ID when it installs it. On main, the .ipa is published in the «ios» release, with a
# SideStore source that offers each new version as an update (see «App para iPhone» in the README).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - run: xcodebuild -version

      # Signed "to run locally" (no Apple account): the simulator only loads app extensions that are
      # signed, like the one that draws the rest on the lock screen (ios/App/RestActivity).
      - name: Build for the simulator
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/sim CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          build -quiet

      - name: Run it in the simulator
        run: |
          # The newest iPhone with a Dynamic Island, to see the rest there.
          read -r UDID NAME < <(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [d for k, v in sorted(runtimes.items(), reverse=True) if "iOS" in k for d in v if d["name"].startswith("iPhone")]
          island = [d for d in phones if re.search(r"iPhone 1[4-9] Pro|iPhone (1[5-9]|[2-9][0-9])\b", d["name"])]
          d = (island or phones)[0]
          print(d["udid"], d["name"])')
          echo "Simulador: $NAME"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          ls build/sim/Build/Products/Debug-iphonesimulator/App.app/PlugIns
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p build/shots
          # Waits up to a minute for the app to say something in its console.
          said() {
            for _ in $(seq 60); do grep -q "$1" build/shots/consola.txt && return; sleep 1; done
            echo "La app no ha dicho: $1"
          }
          # The app's console (the native side's messages and the page's) goes to a file while it runs.
          # -descansoDePrueba starts a rest of 20 seconds 12 seconds after opening (native/strong-native).
          xcrun simctl launch --console-pty "$UDID" io.github.puertamillet.strong2 -descansoDePrueba > build/shots/consola.txt 2>&1 &
          said "StrongNative: descanso en la pantalla de bloqueo"
          sleep 2
          xcrun simctl io "$UDID" screenshot build/shots/inicio.png
          # Another app on screen, as with the iPhone locked: the rest in the Dynamic Island, and then
          # its end, which the app rings in the background.
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 4
          xcrun simctl io "$UDID" screenshot build/shots/isla.png
          said "StrongNative: final del descanso sonado"
          sleep 3
          xcrun simctl io "$UDID" screenshot build/shots/isla-fin.png
          xcrun simctl terminate "$UDID" io.github.puertamillet.strong2 || true
          wait || true
          cat build/shots/consola.txt
          # What iOS said about the rest's extension, if it didn't show.
          xcrun simctl spawn "$UDID" pluginkit -m -v -p com.apple.widgetkit-extension || true
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate 'eventMessage CONTAINS[c] "RestActivity" OR eventMessage CONTAINS[c] "RestAttributes"' | tail -n 80 || true
          # The screenshots in the log too, to look at them without downloading the artifact: the app
          # small, and the Dynamic Island at full size.
          sips -Z 700 -s format jpeg -s formatOptions 60 build/shots/inicio.png --out build/shots/inicio.jpg > /dev/null
          for shot in isla isla-fin; do
            sips -s format jpeg -s formatOptions 60 build/shots/$shot.png --out build/shots/$shot.jpg > /dev/null
          done
          for shot in inicio isla isla-fin; do
            echo "--- captura $shot.jpg (base64) ---"
            base64 -b 76 -i build/shots/$shot.jpg
            echo "--- fin de la captura ---"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: simulador
          path: build/shots

      - name: Check the app's console
        run: |
          # The app's own plugin (native/strong-native) loaded and got the notification sound ready…
          grep -q "StrongNative: sonido de los avisos listo" build/shots/consola.txt
          # …the test rest showed on the lock screen and in the Dynamic Island, and its end rang with
          # the app in the background…
          grep -q "StrongNative: descanso en la pantalla de bloqueo" build/shots/consola.txt
          grep -q "StrongNative: final del descanso sonado con la app en segundo plano" build/shots/consola.txt
          # …and nothing went wrong: the page's errors show as "[error]" (a missing plugin too, see src/lib/native.ts).
          if grep -E "\[error\]|JS ERROR" build/shots/consola.txt; then exit 1; fi

      - name: Build for the iPhone (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build -quiet
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Strong2.ipa Payload)
          ls -l build/Strong2.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Strong2-ipa
          path: build/Strong2.ipa

      - name: Publish it for the iPhone
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD: ${{ github.run_number }}
        run: |
          # The SideStore source: this version, the newest first (SideStore offers it as an update
          # when it differs from the installed one). AltStore's format, which SideStore reads.
          python3 - <<'EOF'
          import datetime, json, os
          repo, version, build = os.environ["REPO"], os.environ["VERSION"], os.environ["BUILD"]
          release = f"https://github.com/{repo}/releases/download/ios"
          today = datetime.date.today().isoformat()
          ipa = {
              "downloadURL": f"{release}/Strong2.ipa",
              "size": os.path.getsize("build/Strong2.ipa"),
          }
          source = {
              "name": "Strong 2.0",
              "identifier": "io.github.puertamillet.strong2.fuente",
              "sourceURL": f"{release}/fuente-sidestore.json",
              "apps": [{
                  "name": "Strong 2.0",
                  "bundleIdentifier": "io.github.puertamillet.strong2",
                  "developerName": "Strong 2.0",
                  "localizedDescription": "Tus entrenos de gimnasio, sin cuotas.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/main/public/pwa-512x512.png",
                  # For older versions of SideStore, which read the newest version from here.
                  "version": version,
                  "versionDate": today,
                  **ipa,
                  "versions": [{
                      "version": version,
                      "buildVersion": build,
                      "date": today,
                      "minOSVersion": "15.0",
                      **ipa,
                  }],
              }],
          }
          with open("build/fuente-sidestore.json", "w") as f:
              json.dump(source, f, ensure_ascii=False, indent=2)
          EOF
          cat build/fuente-sidestore.json
          gh release delete ios --yes --cleanup-tag || true
          gh release create ios build/Strong2.ipa build/fuente-sidestore.json --target "$GITHUB_SHA" --prerelease \
            --title "App para iPhone $VERSION" \
            --notes "Para instalarla y recibir las actualizaciones, añade en SideStore la fuente https://github.com/$REPO/releases/download/ios/fuente-sidestore.json (o abre Strong2.ipa desde el iPhone con SideStore). Ver «App para iPhone» en el README."
